[pytest]
# Regression harness for the exe-reverse skill.
#
# What lives here: executable checks that can run on a bare checkout with only
# the standard library plus pytest. No debugger attach, no driver, no network,
# no live target process.
# What does *not* live here: anything that needs a running Windows target or a
# kernel-mode component. Those routes stay in tests/benchmark.md as recorded
# experiments, and their coverage status is stated in
# docs/tool-verification/EXTENSION-test-harness.md.
#
# If pytest is not installed:
#   python -m pip install pytest
# or run `python tests/run_tests.py`, which prints the same instruction and
# exits 3 (environment-capability failure, per the repository exit-code policy).

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: pure-function and parser assertions against real scripts; zero external deps
    cli: subprocess contract tests over script flags, exit codes and --json output
    integration: no-debugger flows (argv construction, dump/log parsing, patch planners)

# A mis-typed marker or an unknown ini key is a harness bug, not a warning.
addopts = -ra --strict-markers --strict-config
