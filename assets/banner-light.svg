<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="exe-reverse: Windows x86/64 local-software reverse engineering">
  <title>exe-reverse</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFBF8"/>
      <stop offset="1" stop-color="#EFEAE1"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1A1A1A" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- section bars: a PE image read as a shape, not as decoration -->
  <g transform="translate(760 54)">
    <rect x="0"   y="0"   width="196" height="44" rx="3" fill="#1A1A1A" fill-opacity="0.86"/>
    <rect x="0"   y="52"  width="132" height="24" rx="3" fill="#C2410C" fill-opacity="0.88"/>
    <rect x="140" y="52"  width="56"  height="24" rx="3" fill="#1A1A1A" fill-opacity="0.30"/>
    <rect x="0"   y="84"  width="84"  height="18" rx="3" fill="#1A1A1A" fill-opacity="0.22"/>
    <rect x="92"  y="84"  width="104" height="18" rx="3" fill="#1A1A1A" fill-opacity="0.14"/>
    <rect x="0"   y="110" width="196" height="10" rx="3" fill="#1A1A1A" fill-opacity="0.10"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#FCFBF8" fill-opacity="0.95">
      <text x="12" y="28">.text</text>
      <text x="150" y="28" text-anchor="end">60000020</text>
      <text x="12" y="68" fill="#FCFBF8">.rdata</text>
      <text x="196" y="68" text-anchor="end" fill="#1A1A1A" fill-opacity="0.55">.data</text>
    </g>
  </g>

  <!-- the title: monospace, because this is a tool for reading bytes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="140" font-size="68" font-weight="700" fill="#15171A" letter-spacing="-1.5">exe-reverse</text>
    <text x="75" y="176" font-size="17" fill="#C2410C" letter-spacing="0.4">agent skill for Windows local-software analysis</text>
  </g>

  <!-- the three-state vocabulary, which is the thing this project actually enforces -->
  <g transform="translate(72 210)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <circle cx="5" cy="-4" r="4" fill="#15803D"/>
    <text x="18" y="0" fill="#1A1A1A" fill-opacity="0.78">observed</text>
    <circle cx="115" cy="-4" r="4" fill="#C2410C"/>
    <text x="128" y="0" fill="#1A1A1A" fill-opacity="0.78">inferred</text>
    <circle cx="222" cy="-4" r="4" fill="#1A1A1A" fill-opacity="0.28"/>
    <text x="235" y="0" fill="#1A1A1A" fill-opacity="0.78">unverified</text>
    <text x="345" y="0" fill="#1A1A1A" fill-opacity="0.45">every claim carries its strength</text>
  </g>

  <rect x="72" y="248" width="1056" height="2" fill="#1A1A1A" fill-opacity="0.10"/>
</svg>
